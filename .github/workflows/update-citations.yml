name: Update Google Scholar Stats

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install scholarly
       run: pip install scholarly "httpx<0.28"

      - name: Fetch citation stats
        run: python scripts/fetch_scholar_stats.py

      - name: Commit updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/scholar-stats.json
          git diff --staged --quiet || git commit -m "Auto-update Google Scholar stats"
          git push
